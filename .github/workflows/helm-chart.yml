# Every pushed commit gets an installable Console chart named with its Git SHA.
# Publishing to a shared Helm repository is deliberately a separate release decision.
name: Helm chart

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.4

      - name: Lint
        run: helm lint --strict helm/console

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Validate documented values
        run: go test ./internal/config -run TestHelmExistingStackExampleProducesValidConfig

      - name: Render supported modes
        run: |
          set -eu
          helm template console helm/console \
            --namespace modelsphere \
            --include-crds \
            >/tmp/console-rendered.yaml
          helm template console-external helm/console \
            --namespace modelsphere \
            --include-crds \
            --values helm/console/values-existing-stack.example.yaml \
            >/tmp/console-external-rendered.yaml
          helm template console-demo helm/console \
            --namespace modelsphere \
            --include-crds \
            --set demo.enabled=true \
            >/tmp/console-demo-rendered.yaml

      - name: Default images are publicly pullable
        run: |
          set -eu
          auth="$RUNNER_TEMP/docker-anonymous"
          mkdir -p "$auth"
          printf '{"auths":{}}\n' >"$auth/config.json"
          sed -nE 's/^[[:space:]-]*image:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            /tmp/console-rendered.yaml /tmp/console-demo-rendered.yaml | sort -u >/tmp/console-images.txt
          test -s /tmp/console-images.txt
          while IFS= read -r image; do
            echo "checking $image"
            for attempt in 1 2 3; do
              if DOCKER_CONFIG="$auth" docker manifest inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "could not read $image after $attempt attempts" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done </tmp/console-images.txt

      - name: Package
        id: chart
        run: hack/chart.sh --output dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-chart-${{ steps.chart.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
