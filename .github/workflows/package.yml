name: package

# Manual packaging of the console image and chart, from any branch.
#
#   workflow_dispatch only; nothing runs on push, a tag or a pull request.
#   publish.yml stays the automatic channel for main and release tags.
#
# Inputs:
#
#   version            chart version and appVersion; default <appVersion>-git<sha7>
#   image_repository   image the packaged chart points at; default ghcr.io/<owner>/console
#   image_tag          image tag written into the chart; default the version above
#   chart_repository   OCI target for the chart, e.g. oci://quanzhenglong.com/edge/charts;
#                      empty pushes to oci://ghcr.io/<owner>/charts when the image goes there
#   platforms          build platforms; default linux/amd64,linux/arm64
#   push               build the image and push image + chart; default false
#
# GHCR uses the workflow token. Any other registry (quanzhenglong.com, swr, Harbor)
# needs the REGISTRY_USERNAME and REGISTRY_PASSWORD repository secrets; without them
# the run fails in the Version step, before it builds anything.
#
# With push off the run only packages: it stamps the chart, lints it and uploads
# console-<version>.tgz as a workflow artifact, pointing at the image given above.
# That is how a chart is produced for an image that was built somewhere else.
# With push on the same run also builds and pushes the image, and pushes the chart
# when chart_repository names a target.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chart and image version; empty uses <appVersion>-git<sha7>"
        type: string
        required: false
        default: ""
      image_repository:
        description: "Image repository the chart points at; empty uses ghcr.io/<owner>/console"
        type: string
        required: false
        default: ""
      image_tag:
        description: "Image tag the chart points at; empty uses the version"
        type: string
        required: false
        default: ""
      chart_repository:
        description: "OCI target for the chart, e.g. oci://quanzhenglong.com/edge/charts; empty: GHCR when the image goes there, else no chart push"
        type: string
        required: false
        default: ""
      platforms:
        description: "Image build platforms"
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
      push:
        description: "Build and push the image, and push the chart when a target is given"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

# One manual run per ref: a second dispatch waits instead of racing the first.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REPOSITORY_INPUT: ${{ inputs.image_repository }}
          TAG_INPUT: ${{ inputs.image_tag }}
          CHART_INPUT: ${{ inputs.chart_repository }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
          PUSH_INPUT: ${{ inputs.push }}
          REGISTRY_SECRETS: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' helm/console/Chart.yaml)
          version=${VERSION_INPUT:-"$app-git${GITHUB_SHA:0:7}"}
          repository=${REPOSITORY_INPUT:-"ghcr.io/$owner/console"}
          tag=${TAG_INPUT:-"$version"}
          platforms=${PLATFORMS_INPUT:-linux/amd64,linux/arm64}
          chart_repository=${CHART_INPUT:-}
          image_host=${repository%%/*}

          # Inputs reach sed and helm, so reject anything outside a chart version,
          # an image reference or a tag before they are used.
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]{0,62}$'; then
            echo "::error::version $version is not a chart version" >&2; exit 1
          fi
          if ! printf '%s' "$repository" | grep -Eq '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?(:[0-9]+)?/[a-z0-9._/-]+$'; then
            echo "::error::image_repository $repository is not a lowercase image reference" >&2; exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::image_tag $tag is not a tag" >&2; exit 1
          fi
          if ! printf '%s' "$platforms" | grep -Eq '^[a-z0-9]+/[a-z0-9]+(,[a-z0-9]+/[a-z0-9]+)*$'; then
            echo "::error::platforms $platforms is not a comma-separated platform list" >&2; exit 1
          fi
          if [ -n "$chart_repository" ] && ! printf '%s' "$chart_repository" | grep -Eq '^oci://[a-z0-9]([a-z0-9._-]*[a-z0-9])?(:[0-9]+)?/[a-z0-9._/-]+$'; then
            echo "::error::chart_repository $chart_repository is not an oci:// reference" >&2; exit 1
          fi

          # GHCR authenticates with the workflow token, every other registry needs
          # the repository secrets; checking here fails before an image is built.
          chart_host=""
          if [ -n "$chart_repository" ]; then
            chart_ref=${chart_repository#oci://}
            chart_host=${chart_ref%%/*}
          fi
          if [ "$PUSH_INPUT" = true ] && [ -z "$chart_repository" ] && [ "$image_host" = ghcr.io ]; then
            chart_repository="oci://ghcr.io/$owner/charts"
            chart_host=ghcr.io
          fi
          needs_secrets=false
          if [ "$image_host" != ghcr.io ]; then needs_secrets=true; fi
          if [ -n "$chart_host" ] && [ "$chart_host" != ghcr.io ]; then needs_secrets=true; fi
          if [ "$PUSH_INPUT" = true ] && [ "$needs_secrets" = true ] && [ "$REGISTRY_SECRETS" != true ]; then
            echo "::error::pushing to $image_host needs the REGISTRY_USERNAME and REGISTRY_PASSWORD repository secrets" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "repository=$repository"
            echo "tag=$tag"
            echo "platforms=$platforms"
            echo "image_host=$image_host"
            echo "chart_repository=$chart_repository"
            echo "chart_host=$chart_host"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: inputs.push == true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push == true && steps.v.outputs.image_host == 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the registry
        if: inputs.push == true && steps.v.outputs.image_host != 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.v.outputs.image_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push the image
        if: inputs.push == true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.v.outputs.platforms }}
          push: true
          tags: ${{ steps.v.outputs.repository }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Package the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPOSITORY: ${{ steps.v.outputs.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -eu
          sed -e "s|^  repository: .*/[^/]*\$|  repository: $REPOSITORY|" \
              -e "s|^  tag: .*|  tag: \"$TAG\"|" \
              helm/console/values.yaml >values.tmp
          mv values.tmp helm/console/values.yaml
          grep -q "^  repository: $REPOSITORY\$" helm/console/values.yaml \
            || { echo "image.repository in helm/console/values.yaml was not repointed at $REPOSITORY" >&2; exit 1; }
          grep -q "^  tag: \"$TAG\"\$" helm/console/values.yaml \
            || { echo "image.tag in helm/console/values.yaml was not stamped with $TAG" >&2; exit 1; }
          # The swiss subchart is fetched into charts/; helm will not lint or package without it.
          helm dependency build helm/console
          helm lint --strict helm/console
          helm package helm/console --version "$VERSION" --app-version "$VERSION" --destination dist
          ls -l dist

      - name: Upload the chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/console-${{ steps.v.outputs.version }}.tgz
          # The chart archive is the deliverable; keep the .tgz downloadable as-is.
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Push the chart
        if: inputs.push == true && steps.v.outputs.chart_repository != ''
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CHART_REPOSITORY: ${{ steps.v.outputs.chart_repository }}
          CHART_HOST: ${{ steps.v.outputs.chart_host }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          if [ "$CHART_HOST" = ghcr.io ]; then
            printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          else
            printf '%s' "$REGISTRY_PASSWORD" | helm registry login "$CHART_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          fi
          helm push "dist/console-$VERSION.tgz" "$CHART_REPOSITORY"
