image:
  repository: swr.cn-east-3.myhuaweicloud.com/risecloud/console
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# For a private registry, e.g. [{name: swr-creds}]. Console's pods only; the
# swiss subchart takes its own, swiss.imagePullSecrets.
imagePullSecrets: []

# Two by default: with the router on, programs call models through console, so a
# console restart is an inference outage. A PodDisruptionBudget keeps one up
# through node drains whenever there is more than one.
replicaCount: 2

# NodePort by default so the UI is reachable the moment the install finishes;
# the chart's NOTES print the address. ClusterIP plus an ingress for anything
# longer-lived.
service:
  type: NodePort
  port: 8080
  # Only with type NodePort; empty lets Kubernetes pick one.
  nodePort: ""

# Identity signing. jwtSecret is generated on first install if left empty, and
# kept in a Secret. Share it with Rise Global to make an upgrade seamless.
auth:
  jwtSecret: ""       # empty => generated once and stored in the Secret
  issuer: "https://console.modelsphere.local"
  tokenTTL: 24h

# Zero-config login: helm seeds this admin User CRD (P1). encryptedPassword is a
# bcrypt hash baked at packaging time; the operator changes the password on
# first login. groups:[system:masters] makes the authorizer allow everything.
admin:
  username: admin
  # bcrypt of the default password `P@88w0rd`. Change on first login, or set a
  # different hash here: htpasswd -bnBC 12 "" '<pw>' | tr -d ':\n'
  encryptedPassword: "$2b$12$Q44Y0B99hoByZY.6v30jl.D83rXFbSpOfh8iWLbndLZBEjFAZwaeO"
  # Require the seeded administrator to change its password after first login.
  # Set false when encryptedPassword already contains an operator-chosen secret.
  requirePasswordReset: true

# Backends federated behind the portal. Each prefix is reverse-proxied to url,
# the prefix replaced by url's path: /api/deploy/catalog -> swissd /api/catalog.
# The prefix must sit under /api/ (that is what puts it behind login).
# Access is RBAC on resource "backends", resourceName = name; the verb follows
# the HTTP method (GET get, POST create, PUT/PATCH update, DELETE delete).
#
# A backend that authenticates with a credential of its own names the environment
# variable holding it in apiKeyEnv. console then sends `Authorization: Bearer
# <value>` instead of the caller's token, so the key stays in the cluster and out
# of the browser. The value comes from a Secret: see backendSecrets.
#
# swiss.enabled below adds the "swiss" backend (/api/deploy -> the bundled
# swissd) by itself. List one here only for a swissd installed elsewhere, e.g.
#   - name: swiss
#     prefix: /api/deploy
#     url: http://swiss.swiss.svc:80/api
backends: []

# swissd, the deploy control plane behind the 模型部署 menu, installed as a
# subchart (charts/swiss, a copy of modelsphere/swiss's chart). Everything under
# this key is that chart's values; the ones set here are what running behind
# console means:
#
#   auth.disabled   swissd has no login of its own. console authenticates the
#                   user and authorises each call with RBAC on backends/swiss.
#   networkPolicy   so only console's pods can reach swissd -- with no login,
#                   anything else that reached it could deploy.
#
# Before enabling, the cluster needs what a swiss deploy renders against: the
# model charts' registry, GPU nodes with weights at the profile's pathTemplate,
# llm-openresty's route ConfigMap, and the CRDs the charts create
# (LeaderWorkerSet, LLMScaler, LLMSLORequirement, ModelRoute). swissd's setup
# page writes the site profile that names them, on first visit.
swiss:
  enabled: false

  # Only console's pods may connect to swissd. Needs a CNI that enforces
  # NetworkPolicy; on one that does not (flannel) this is inert, so swissd is
  # then open to anything in the cluster.
  networkPolicy:
    enabled: true

  image:
    repository: swr.cn-east-3.myhuaweicloud.com/risecloud/swissd
    tag: ""
  auth:
    disabled: true
    create: false
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false

  config:
    # The model catalog swissd lists and composes plans from.
    catalog: "https://models.example.com/swiss-catalog/"
    cluster:
      # REQUIRED when enabled: recorded against every plan composed here.
      name: ""
    # Deploy, upgrade, uninstall and rollback. Off leaves swissd read-only.
    allowDeploy: true

  rbac:
    # Namespaces swissd may deploy into and read releases from, when
    # rbac.scope is namespaced. Include the site profile's namespace.
    scope: namespaced
    namespaces: []

# The built-in inference gateway: llm-openresty with one aggregate route, "llm",
# serving the demo model and gateway.models. It is what makes a bare `helm
# install` usable -- the Playground and /v1 work without naming anything. When
# playground.gateway below names an existing gateway, that one is used instead
# and none of this is installed.
gateway:
  enabled: true
  image:
    repository: 4pdosc/llm-openresty
    tag: "0.1.20"
    pullPolicy: IfNotPresent
  # Watches the routes and keys and reloads nginx in place.
  reloadImage: 4pdosc/autoconfig-reload:0.3.46
  replicas: 1
  route: llm
  # Concurrent requests per model before the gateway answers 429.
  maxConcurrency: 64
  # Streams in flight get this long to finish when a pod stops.
  terminationGracePeriodSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "2", memory: 1Gi }
  # OpenAI-compatible endpoints to serve besides the demo model. name is the id
  # clients send and must equal what the engine serves; url is its base, e.g.
  #   - name: qwen3-32b
  #     url: http://qwen3-32b.models.svc.cluster.local:8000
  models: []

# A small CPU model, on by default so a fresh install has something to chat
# with: llama.cpp serving Qwen2.5-0.5B-Instruct (Q4_K_M, ~500 MB), downloaded
# once into a PVC -- from ModelScope, then hf-mirror. Needs ~2 CPU and 1 GiB;
# answers are what a 0.5B model gives. Turn it off once real models are in.
demo:
  enabled: true
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-b11206
    pullPolicy: IfNotPresent
  model:
    name: qwen2.5-0.5b-instruct
    file: qwen2.5-0.5b-instruct-q4_k_m.gguf
    urls:
      - https://modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/master/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  port: 8080
  # Context is split across the parallel slots.
  # -t matches the CPU limit: one thread per node core would be throttled.
  extraArgs: ["-c", "8192", "-np", "2", "-t", "4", "--no-webui"]
  persistence:
    # Off, the weights are downloaded again on every restart.
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "4", memory: 2Gi }

# An existing inference gateway, resolved from the cluster instead of named
# here: console reads the entrypoint Service, the route to talk to and the key
# from what is already the source of truth, and re-reads it as the cluster
# changes. No URL to let go stale, no route list to keep in step with deploys,
# and no copy of the gateway key in this release.
#
#   profile    swiss's site profile ConfigMap, "namespace/name" -- the document
#              swissd deploys from, which already names the entrypoint Service,
#              the shared route ConfigMap and the key Secret. Prefer this: the
#              console and swissd then cannot disagree about where the entrypoint
#              is.
#   configMap  the openresty route ConfigMap and its Service, "namespace/name",
#              for an install with no swissd. The aggregate route -- the one
#              serving several models -- is chosen from the ConfigMap's
#              session_route_<route>.conf keys.
#   route      pins one route instead of choosing. Empty means the aggregate one.
#   fromSwiss  with swiss.enabled and neither profile nor configMap set, use the
#              bundled swissd's site profile -- the gateway its deploys land on.
#   namespaces extra namespaces console may read ConfigMaps and Secrets in. A
#              profile names the route ConfigMap and key Secret only once it is
#              written, so list the gateway's namespace here (e.g. llm-route).
#
# Left empty, the built-in gateway above is used.
playground:
  gateway:
    profile: ""
    configMap: ""
    service: ""
    route: ""
    fromSwiss: true
    namespaces: []
    # Optional overrides. secretRef names the Secret holding the gateway's keys
    # (normally read from the profile); apiKeyEnv takes the key from an
    # environment variable instead, for an install that copies it into its own
    # namespace -- then wire it through backendSecrets below.
    secretRef: ""
    apiKeyEnv: ""

# The router: programs call models at <console>/v1 with API keys admins issue on
# the router's API keys page (plaintext shown once; only a hash is kept). /v1 is
# forwarded to the gateway -- built-in or playground.gateway -- with the gateway's own
# key, so the gateway itself is unchanged and never sees these keys.
#
# The keys live in a Secret console creates in this release's namespace,
# <fullname>-api-keys. It is not part of the chart, so an upgrade or rollback
# never touches issued keys; uninstalling leaves it behind too.
#
# Usage is exported as metrics (router_requests_total by key, model and status,
# router_key_last_request_timestamp_seconds, router_rejected_total by reason),
# not recorded on the keys.
router:
  enabled: true
  # Largest /v1 request body accepted, in bytes. The body is read whole to check
  # which model it asks for. Empty means 16 MiB.
  maxBodyBytes: ""

# Prometheus metrics on a port and a ClusterIP Service (<fullname>-metrics) of
# their own, so they are not reachable wherever the UI is exposed -- a NodePort
# service.type applies to the UI only. Pods carry prometheus.io/* scrape annotations; with the
# Prometheus Operator, turn on the ServiceMonitor instead.
metrics:
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, for an operator that selects ServiceMonitors by label.
    labels: {}

# Backend credentials, each read from a Secret key into the environment variable
# it is keyed by. For a backend whose config names an apiKeyEnv; the gateway
# above needs none, because console reads its key from the cluster. The Secret
# must already exist: a key kept in this chart's Secret would become a chart
# value, and values end up in release history.
backendSecrets: {}

# RBAC for the iam CRDs and native cluster roles/bindings the authorizer reads,
# plus read on the gateway's ConfigMaps and key Secret when one is configured.
rbac:
  create: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
