---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: plugins.modelsphere.dev
spec:
  group: modelsphere.dev
  names:
    categories:
    - rise
    kind: Plugin
    listKind: PluginList
    plural: plugins
    singular: plugin
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Plugin is the Schema for the plugins API.
          It represents an installable extension managed via Helm.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PluginSpec defines the desired state of a Plugin.
            properties:
              chart:
                description: |-
                  Chart holds the Helm chart location and release configuration.
                  Only used when type=helm.
                properties:
                  name:
                    description: Name is the chart name in the repository.
                    type: string
                  namespace:
                    description: Namespace is the target namespace for the Helm release.
                    type: string
                  releaseName:
                    description: |-
                      ReleaseName overrides the Helm release name (defaults to the Plugin CR
                      metadata.name, which encodes the plugin identity as group--name).
                    type: string
                  repository:
                    description: Repository is the chart repository URL.
                    type: string
                  timeout:
                    description: |-
                      Timeout bounds each Helm install, upgrade and uninstall of this chart,
                      hooks included, as a Go duration ("15m"). Omitted or non-positive means
                      5 minutes.

                      It is a string rather than metav1.Duration on purpose: the controller
                      writes the spec back when it adds its finalizer, and metav1.Duration
                      would normalize "15m" to "15m0s" — a permanent diff for the GitOps
                      writer of the Plugin CR.
                    pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                    type: string
                type: object
              enabled:
                default: true
                description: |-
                  Enabled controls whether the plugin is active.
                  For helm plugins, false hides entry points and preserves the release and IAM.
                  For in-process plugins, false hides the module from the sidebar.
                type: boolean
              scope:
                default: platform
                description: |-
                  Scope controls plugin visibility: "platform" (global, visible in Boss)
                  or "workspace" (per-tenant authorization required, visible in Console).
                enum:
                - platform
                - workspace
                type: string
              type:
                default: helm
                description: 'Type is the plugin deployment type: "helm" or "in-process".'
                enum:
                - helm
                - in-process
                type: string
              values:
                description: |-
                  Values are Helm values overrides passed to the chart.
                  Only used when type=helm.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: |-
                  Version is the desired Helm chart version. The Plugin HTTP CRUD API
                  requires it; the CRD remains optional for declarative writer compatibility.
                type: string
            required:
            - enabled
            type: object
          status:
            description: PluginStatus defines the observed state of a Plugin.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              frontendStatus:
                description: FrontendStatus tracks frontend resource distribution
                  state.
                properties:
                  distributed:
                    description: Distributed indicates resources have been copied
                      to the serving location.
                    type: boolean
                  distributedAt:
                    description: DistributedAt is the timestamp of the last distribution.
                    format: date-time
                    type: string
                  entryURL:
                    description: |-
                      EntryURL is the serving path for the frontend bundle.
                      Example: /plugins/rise.io/v1/compute/index.umd.js
                    type: string
                required:
                - distributed
                type: object
              lastTransitionTime:
                description: LastTransitionTime is the last time the phase transitioned.
                format: date-time
                type: string
              message:
                description: Message is a human-readable description of the current
                  state.
                type: string
              observedDelivery:
                description: |-
                  ObservedDelivery identifies the Karmada delivery of the object at
                  ObservedGeneration. Nil on a Plugin not delivered by Karmada.
                properties:
                  revision:
                    description: |-
                      Revision is the plugin.rise.io/delivery-revision annotation: the digest
                      of the per-cluster overrides applied by the PluginClusterInstall.
                    type: string
                  templateGeneration:
                    description: |-
                      TemplateGeneration is the resourcetemplate.karmada.io/generation
                      annotation: the Global-plane Plugin generation Karmada rendered.
                    format: int64
                    type: integer
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation this status was written
                  for. Phase describes that generation only.
                format: int64
                type: integer
              observedHash:
                description: |-
                  ObservedHash is the hash of the last reconciled spec.
                  Used for idempotent reconciliation (skip if unchanged).
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              pluginMeta:
                description: PluginMeta holds metadata extracted from plugin.yaml
                  inside the chart.
                properties:
                  activation:
                    description: Activation holds activation policy configuration.
                    properties:
                      policy:
                        description: 'Policy: "auto" (all tenants), "manual" (admin
                          enables per tenant), "required" (cannot disable).'
                        type: string
                    type: object
                  apiAccess:
                    description: APIAccess lists API paths the plugin needs access
                      to.
                    items:
                      type: string
                    type: array
                  apiVersion:
                    description: APIVersion is the plugin API version (e.g., "v1").
                    type: string
                  depends:
                    description: |-
                      Depends declares plugin names and version constraints from plugin.yaml.
                      Disable checks match names only; they do not solve version constraints.
                    items:
                      description: PluginDependency identifies a prerequisite declared
                        by plugin.yaml.
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  description:
                    description: Description is a short description of the plugin.
                    type: string
                  displayName:
                    description: DisplayName is the human-readable plugin name.
                    type: string
                  frontend:
                    description: Frontend holds frontend integration configuration.
                    properties:
                      entry:
                        description: Entry is the entry filename for remote plugins.
                        type: string
                      runtime:
                        description: 'Runtime specifies the loading mechanism: "built-in"
                          or "remote".'
                        type: string
                      type:
                        description: 'Type is the frontend integration type: "component"
                          or "iframe".'
                        type: string
                    required:
                    - type
                    type: object
                  group:
                    description: Group is the API group (e.g., "rise.io").
                    type: string
                  name:
                    description: Name is the plugin identifier.
                    type: string
                  roleTemplates:
                    description: RoleTemplates are permission templates declared by
                      the plugin.
                    items:
                      description: PluginRoleTemplate defines a permission template
                        declared in plugin.yaml.
                      properties:
                        displayName:
                          description: DisplayName is the human-readable name.
                          type: string
                        name:
                          description: Name is the role template identifier.
                          type: string
                        rules:
                          description: Rules are Kubernetes-style RBAC policy rules.
                          items:
                            description: PolicyRule defines a Kubernetes-style RBAC
                              rule within plugin.yaml.
                            properties:
                              apiGroups:
                                items:
                                  type: string
                                type: array
                              resources:
                                items:
                                  type: string
                                type: array
                              verbs:
                                items:
                                  type: string
                                type: array
                            required:
                            - apiGroups
                            - resources
                            - verbs
                            type: object
                          type: array
                        scope:
                          description: 'Scope is the RBAC scope: "platform", "cluster",
                            "workspace", "namespace".'
                          type: string
                        uiPermissions:
                          description: UIPermissions are frontend permission keys.
                          items:
                            type: string
                          type: array
                      required:
                      - name
                      type: object
                    type: array
                  uninstallPrecheck:
                    description: |-
                      UninstallPrecheck declares the endpoint the platform asks before a
                      Plugin CR may be deleted. Omitted means deletion is never prechecked.
                    properties:
                      path:
                        description: |-
                          Path is an /oapis/... path served through one of the plugin's
                          ReverseProxy routes. The platform sends GET and expects 200 with
                          {"allowed": bool, "reason": string}.
                        type: string
                      timeoutSeconds:
                        description: TimeoutSeconds bounds one precheck call. Omitted
                          means 10; at most 25.
                        format: int32
                        type: integer
                    required:
                    - path
                    type: object
                  version:
                    description: |-
                      Version is the plugin product version declared by plugin.yaml.
                      It is independent from the Helm chart version.
                    type: string
                required:
                - apiVersion
                - description
                - displayName
                - frontend
                - group
                - name
                - version
                type: object
              releaseName:
                description: ReleaseName is the Helm release name after installation.
                type: string
              releaseVersion:
                description: ReleaseVersion is the Helm release revision number.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
