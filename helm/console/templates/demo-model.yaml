{{- /*
A small CPU model the Playground and /v1 talk to directly, for a cluster with no
inference gateway. llama.cpp serves one GGUF file, downloaded once into a PVC by
the init container.
*/ -}}
{{- if .Values.demo.enabled }}
{{- $name := printf "%s-demo" (include "console.fullname" .) }}
{{- $d := .Values.demo }}
{{- if $d.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
  annotations:
    # Weights outlive the release: a reinstall must not download them again.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $d.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $d.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-model
spec:
  replicas: 1
  # One writer for the weights volume.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "console.componentSelectorLabels" (list . "demo-model") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.componentSelectorLabels" (list . "demo-model") | nindent 8 }}
    spec:
      initContainers:
        - name: fetch
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              f=/models/{{ $d.model.file }}
              [ -s "$f" ] && { echo "have $f"; exit 0; }
              for u in {{ range $d.model.urls }}{{ . | squote }} {{ end }}; do
                echo "fetching $u"
                if curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 -C - -o "$f.part" "$u"; then
                  mv "$f.part" "$f"; exit 0
                fi
              done
              echo "could not download {{ $d.model.file }} from any of demo.model.urls" >&2
              exit 1
          volumeMounts:
            - { name: models, mountPath: /models }
      containers:
        - name: llama-server
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy }}
          args:
            - "-m"
            - "/models/{{ $d.model.file }}"
            - "--alias"
            - {{ $d.model.name | quote }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $d.port | quote }}
            {{- range $d.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ $d.port }} }
          # /health is 503 while the model loads.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: models
          {{- if $d.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $name }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-model
spec:
  type: ClusterIP
  selector:
    {{- include "console.componentSelectorLabels" (list . "demo-model") | nindent 4 }}
  ports:
    - { name: http, port: {{ $d.port }}, targetPort: http }
{{- end }}
