apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  console.yaml: |
    server:
      addr: ":8080"
      metricsAddr: {{ printf ":%d" (int .Values.metrics.port) | quote }}
      auth:
        {{- if .Values.auth.disabled }}
        disabled: true
        {{- end }}
        issuer: {{ .Values.auth.issuer | quote }}
        tokenTTL: {{ .Values.auth.tokenTTL | quote }}
        # jwtSecret is injected from the Secret via env, not rendered here.
    backends:
      {{- range .Values.backends }}
      - name: {{ .name | quote }}
        prefix: {{ .prefix | quote }}
        url: {{ .url | quote }}
        {{- with .apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- $gw := .Values.playground.gateway }}
      {{- if or $gw.profile $gw.configMap }}
      # Resolved from the cluster at startup: see the gateway section of values.
      - name: llm
        prefix: /api/llm
        {{- with $gw.apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
        gateway:
          {{- with $gw.profile }}
          profile: {{ . | quote }}
          {{- end }}
          {{- with $gw.configMap }}
          configMap: {{ . | quote }}
          {{- end }}
          {{- with $gw.service }}
          service: {{ . | quote }}
          {{- end }}
          {{- with $gw.route }}
          route: {{ . | quote }}
          {{- end }}
          {{- with $gw.secretRef }}
          secretRef: {{ . | quote }}
          {{- end }}
      {{- else if include "console.gateway.builtin" . }}
      {{- $name := include "console.gateway.name" . }}
      # The built-in gateway: see the gateway section of values.
      - name: llm
        prefix: /api/llm
        gateway:
          configMap: {{ printf "%s/%s-routes" .Release.Namespace $name | quote }}
          service: {{ printf "%s/%s" .Release.Namespace $name | quote }}
          secretRef: {{ printf "%s-keys" $name | quote }}
          route: {{ .Values.gateway.route | quote }}
      {{- end }}
    {{- if include "console.router.enabled" . }}
    router:
      secret: {{ printf "%s/%s" .Release.Namespace (include "console.router.secret" .) | quote }}
      backend: llm
      {{- with .Values.router.maxBodyBytes }}
      maxBodyBytes: {{ . | int64 }}
      {{- end }}
    {{- end }}
