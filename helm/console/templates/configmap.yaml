apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  console.yaml: |
    server:
      addr: ":8080"
      metricsAddr: {{ printf ":%d" (int .Values.metrics.port) | quote }}
      auth:
        {{- if .Values.auth.disabled }}
        disabled: true
        {{- end }}
        issuer: {{ .Values.auth.issuer | quote }}
        tokenTTL: {{ .Values.auth.tokenTTL | quote }}
        # jwtSecret is injected from the Secret via env, not rendered here.
    backends:
      {{- range .Values.backends }}
      - name: {{ .name | quote }}
        prefix: {{ .prefix | quote }}
        url: {{ .url | quote }}
        {{- with .apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- $gw := .Values.playground.gateway }}
      {{- if and (include "console.gateway" .) .Values.demo.enabled }}
      {{- fail "demo.enabled and playground.gateway both name the Playground's models; set one" }}
      {{- end }}
      {{- if include "console.gateway" . }}
      # Resolved from the cluster at startup: see the gateway section of values.
      - name: llm
        prefix: /api/llm
        {{- with $gw.apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
        gateway:
          {{- with $gw.profile }}
          profile: {{ . | quote }}
          {{- end }}
          {{- with $gw.configMap }}
          configMap: {{ . | quote }}
          {{- end }}
          {{- with $gw.service }}
          service: {{ . | quote }}
          {{- end }}
          {{- with $gw.route }}
          route: {{ . | quote }}
          {{- end }}
          {{- with $gw.secretRef }}
          secretRef: {{ . | quote }}
          {{- end }}
      {{- else if .Values.demo.enabled }}
      # The demo model, straight to llama.cpp: see the demo section of values.
      - name: llm
        prefix: /api/llm
        url: {{ printf "http://%s-demo.%s.svc:%d" (include "console.fullname" .) .Release.Namespace (int .Values.demo.port) | quote }}
      {{- end }}
    {{- if include "console.router.enabled" . }}
    router:
      secret: {{ printf "%s/%s" .Release.Namespace (include "console.router.secret" .) | quote }}
      backend: llm
      {{- with .Values.router.maxBodyBytes }}
      maxBodyBytes: {{ . | int64 }}
      {{- end }}
    {{- end }}
