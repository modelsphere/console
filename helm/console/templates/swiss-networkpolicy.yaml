{{- /* swissd runs with no login behind console, so console is the only thing allowed to reach it. */ -}}
{{- if and .Values.swiss.enabled .Values.swiss.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "console.swiss.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ default "swiss" .Values.swiss.nameOverride }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "console.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
